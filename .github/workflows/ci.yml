name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 배포는 Netlify가 한다(netlify.toml). 여기서는 PR·푸시마다 테스트와 빌드만 확인한다.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 물리·수학 테스트
        run: npm test
      - name: 타입체크 + 빌드
        run: npm run build
