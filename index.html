<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Science Lab — 만져보는 과학</title>
    <meta name="description" content="물리와 수학을 브라우저에서 직접 만져보는 인터랙티브 실험실. 만유인력 태양계부터 시작합니다." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./">Science<span>Lab</span></a>
    </header>

    <main class="home">
      <section class="hero">
        <h1>읽는 과학 말고,<br /><em>만져보는 과학.</em></h1>
        <p>공식 하나를 코드로 옮기면 우주가 움직입니다. 슬라이더를 밀고, 행성을 던지고, 법칙이 맞는지 직접 확인해 보세요.</p>
      </section>

      <section class="grid">
        <a class="card" href="./experiments/solar-system/">
          <div class="card-art" aria-hidden="true">
            <svg viewBox="0 0 200 120">
              <circle cx="100" cy="60" r="44" fill="none" stroke="#2a3150" />
              <circle cx="100" cy="60" r="26" fill="none" stroke="#2a3150" />
              <circle cx="100" cy="60" r="9" fill="#ffd35c" />
              <circle cx="126" cy="60" r="4" fill="#5aa9ff" />
              <circle cx="69" cy="30" r="6" fill="#d9a066" />
            </svg>
          </div>
          <div class="card-body">
            <span class="tag">역학</span>
            <h2>만유인력 태양계</h2>
            <p>F = Gm₁m₂/r². G를 바꾸고, 행성을 던지고, 케플러 제3법칙을 직접 측정해요.</p>
          </div>
        </a>

        <a class="card" href="./experiments/double-pendulum/">
          <div class="card-art" aria-hidden="true">
            <svg viewBox="0 0 200 120">
              <path d="M60 95 C 80 40, 120 110, 150 30 S 120 90, 70 60" fill="none" stroke="#3a4470" />
              <line x1="100" y1="22" x2="132" y2="52" stroke="#7aa2ff" stroke-width="2" />
              <line x1="132" y1="52" x2="118" y2="92" stroke="#7aa2ff" stroke-width="2" />
              <line x1="100" y1="22" x2="134" y2="50" stroke="#c48bff" stroke-width="2" opacity="0.7" />
              <line x1="134" y1="50" x2="158" y2="78" stroke="#c48bff" stroke-width="2" opacity="0.7" />
              <circle cx="100" cy="22" r="3" fill="#e7e9f3" />
              <circle cx="132" cy="52" r="5" fill="#7aa2ff" />
              <circle cx="118" cy="92" r="5" fill="#7aa2ff" />
              <circle cx="158" cy="78" r="5" fill="#c48bff" />
            </svg>
          </div>
          <div class="card-body">
            <span class="tag">카오스</span>
            <h2>이중 진자</h2>
            <p>시작 각도 0.001° 차이가 어떻게 완전히 다른 운명이 되는지. 예측 가능 시간을 직접 재봐요.</p>
          </div>
        </a>

        <a class="card" href="./experiments/fourier/">
          <div class="card-art" aria-hidden="true">
            <svg viewBox="0 0 200 120">
              <circle cx="80" cy="60" r="30" fill="none" stroke="#2a3150" />
              <line x1="80" y1="60" x2="104" y2="42" stroke="#e7e9f3" />
              <circle cx="104" cy="42" r="14" fill="none" stroke="#2a3150" />
              <line x1="104" y1="42" x2="116" y2="49" stroke="#e7e9f3" />
              <circle cx="116" cy="49" r="6" fill="none" stroke="#2a3150" />
              <path d="M118 52 C 135 30, 160 35, 158 55 C 156 75, 130 85, 118 100 C 106 85, 80 75, 78 55" fill="none" stroke="#ffd35c" stroke-width="2" />
            </svg>
          </div>
          <div class="card-body">
            <span class="tag">수학</span>
            <h2>푸리에 에피사이클</h2>
            <p>원을 돌리는 원을 돌리는 원으로 어떤 그림이든. 직접 그린 그림도 됩니다.</p>
          </div>
        </a>
      </section>
    </main>

    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
